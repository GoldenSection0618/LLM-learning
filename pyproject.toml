[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-learning"
version = "0.1.0"
description = "LLM 自学计划中的模型与训练实验"
requires-python = ">=3.11"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
